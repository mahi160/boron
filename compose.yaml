# Boron. Works as a Portainer stack or with `docker compose up -d`: it pulls the published image.
# To run your own build instead: `docker build -t ghcr.io/mahi160/boron:latest .` first.
services:
  boron:
    image: ghcr.io/mahi160/boron:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      # Only seeds the first-run settings; edit providers on the Settings screen afterwards.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - boron-data:/data
      # Subscription logins to borrow (see README). Uncomment the ones you have; they must be read-write,
      # because Boron writes refreshed tokens back.
      # - ~/.pi/agent:/logins/pi
      # - ~/.claude:/logins/claude
      # - ~/.codex:/logins/codex
    # Lets the container reach Ollama on the host as http://host.docker.internal:11434 (also on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  boron-data:
